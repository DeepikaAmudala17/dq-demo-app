<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>To-Do List</title>
  <style>
    :root {
      --bg: #f7f6f3;
      --ink: #1c1c1c;
      --muted: #5c5c5c;
      --line: #d4d0c8;
      --accent: #2f5d50;
      --accent-hover: #244a40;
      --danger: #b42318;
      --card: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse at top left, #ebe8e1 0%, transparent 55%),
        linear-gradient(180deg, #faf9f6 0%, var(--bg) 100%);
      min-height: 100vh;
    }

    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 3rem;
    }

    h1 {
      margin: 0 0 0.25rem;
      font-size: 1.75rem;
      font-weight: 650;
      letter-spacing: -0.02em;
    }

    .meta {
      color: var(--muted);
      margin-bottom: 1.5rem;
    }

    .error {
      display: none;
      background: #fef3f2;
      color: var(--danger);
      border: 1px solid #fecdca;
      padding: 0.75rem 1rem;
      margin-bottom: 1rem;
      border-radius: 6px;
    }

    .error.visible {
      display: block;
    }

    form.add {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    input[type="text"],
    input[type="date"] {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0.55rem 0.7rem;
      font: inherit;
      background: var(--card);
    }

    button {
      border: none;
      border-radius: 6px;
      padding: 0.55rem 0.9rem;
      font: inherit;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
    }

    button:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    button.secondary {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line);
    }

    button.secondary:hover:not(:disabled) {
      background: #eeebe4;
    }

    .list {
      list-style: none;
      margin: 0;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      overflow: hidden;
    }

    .list li {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--line);
    }

    .list li:last-child {
      border-bottom: none;
    }

    .list li.done span {
      text-decoration: line-through;
      color: var(--muted);
    }

    .list input[type="checkbox"] {
      width: 1.1rem;
      height: 1.1rem;
      accent-color: var(--accent);
    }

    .empty {
      padding: 1.25rem 1rem;
      color: var(--muted);
      text-align: center;
    }

    .pager {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-top: 1rem;
    }

    .page-label {
      color: var(--muted);
    }

    @media (max-width: 560px) {
      form.add {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>To-Do List</h1>
    <p class="meta">Completed: <span id="completed-count">0</span></p>

    <div id="error" class="error" role="alert"></div>

    <form class="add" id="add-form">
      <input type="text" id="title" name="title" placeholder="New to-do title" required />
      <input type="date" id="dueDate" name="dueDate" />
      <button type="submit">Add</button>
    </form>

    <ul class="list" id="todo-list"></ul>

    <div class="pager">
      <button type="button" class="secondary" id="prev-btn">Previous</button>
      <span class="page-label" id="page-label">Page 1 of 1</span>
      <button type="button" class="secondary" id="next-btn">Next</button>
    </div>
  </main>

  <script>
    const PAGE_SIZE = 5;
    let currentPage = 1;
    let totalPages = 1;

    const errorEl = document.getElementById('error');
    const listEl = document.getElementById('todo-list');
    const completedEl = document.getElementById('completed-count');
    const pageLabel = document.getElementById('page-label');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const addForm = document.getElementById('add-form');

    function showError(message) {
      errorEl.textContent = message || 'Something went wrong';
      errorEl.classList.add('visible');
    }

    function clearError() {
      errorEl.textContent = '';
      errorEl.classList.remove('visible');
    }

    async function parseResponse(res) {
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        throw new Error(data.error || res.statusText || 'Request failed');
      }
      return data;
    }

    function renderPager() {
      pageLabel.textContent = 'Page ' + currentPage + ' of ' + totalPages;
      prevBtn.disabled = currentPage <= 1;
      nextBtn.disabled = currentPage >= totalPages;
    }

    function renderTodos(items) {
      listEl.innerHTML = '';
      if (!items.length) {
        const empty = document.createElement('li');
        empty.className = 'empty';
        empty.textContent = 'No to-dos on this page.';
        listEl.appendChild(empty);
        return;
      }

      for (const todo of items) {
        const li = document.createElement('li');
        if (todo.completed) li.classList.add('done');

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = !!todo.completed;
        checkbox.addEventListener('change', () => {
          setCompleted(todo.id, checkbox.checked);
        });

        const label = document.createElement('span');
        label.textContent = todo.summary;

        li.appendChild(checkbox);
        li.appendChild(label);
        listEl.appendChild(li);
      }
    }

    async function loadTodos() {
      clearError();
      try {
        const res = await fetch('/todos?page=' + currentPage + '&size=' + PAGE_SIZE);
        const data = await parseResponse(res);
        currentPage = data.page;
        totalPages = data.totalPages;
        completedEl.textContent = String(data.completedCount);
        renderTodos(data.items);
        renderPager();
      } catch (err) {
        showError(err.message);
        listEl.innerHTML = '';
        renderPager();
      }
    }

    async function setCompleted(id, completed) {
      clearError();
      try {
        const res = await fetch('/todos/' + id, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ completed }),
        });
        await parseResponse(res);
        await loadTodos();
      } catch (err) {
        showError(err.message);
        await loadTodos();
      }
    }

    addForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      clearError();
      const title = document.getElementById('title').value;
      const dueDate = document.getElementById('dueDate').value;
      try {
        const body = { title };
        if (dueDate) body.dueDate = dueDate;
        const res = await fetch('/todos', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        await parseResponse(res);
        addForm.reset();
        currentPage = 1;
        await loadTodos();
      } catch (err) {
        showError(err.message);
      }
    });

    prevBtn.addEventListener('click', () => {
      if (currentPage > 1) {
        currentPage -= 1;
        loadTodos();
      }
    });

    nextBtn.addEventListener('click', () => {
      if (currentPage < totalPages) {
        currentPage += 1;
        loadTodos();
      }
    });

    loadTodos();
  </script>
</body>
</html>
